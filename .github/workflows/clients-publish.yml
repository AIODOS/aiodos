# Publier les bibliothèques clientes aiodos-client sur PyPI et npm (clients/PUBLIER.md).
# Déclenché par une étiquette « clients-v<version> » poussée sur github.com/AIODOS/aiodos,
# après « py -3.14 tools/publish_clients.py » sur le PC de l'auteur. « Trusted publishing » :
# aucun jeton n'est gardé nulle part, PyPI et npm font confiance à ce seul workflow (OIDC), et
# npm attache la provenance du paquet. Actions épinglées par empreinte de commit.
name: Publier les clients

on:
  push:
    tags: ["clients-v*"]

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          node-version: "24"
      - name: Version de l'étiquette = version des clients
        run: |
          tag="${GITHUB_REF_NAME#clients-v}"
          py=$(python -c "import tomllib; print(tomllib.load(open('clients/python/pyproject.toml','rb'))['project']['version'])")
          js=$(node -p "require('./clients/js/package.json').version")
          test "$tag" = "$py" && test "$tag" = "$js"
      - name: Essais du client Python
        run: |
          python -m pip install pytest==8.3.5
          python -m pytest -q clients/python/tests
      - name: Essais du client JavaScript
        working-directory: clients/js
        run: node --test

  pypi:
    needs: verifier
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.12"
      - name: Construire la roue et l'archive des sources
        run: |
          python -m pip install build==1.2.2.post1
          python -m build clients/python --outdir dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33   # v1.14.2
        with:
          packages-dir: dist

  npm:
    needs: verifier
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publier sur npm (provenance, trusted publishing)
        working-directory: clients/js
        run: npm publish --provenance --access public
