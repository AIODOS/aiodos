[package]
name = "aiodos-net"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "Compagnon réseau d'AIODOS : relie les machines appairées par Internet (Iroh)"
repository = "https://github.com/AIODOS/aiodos"
publish = false

[dependencies]
# Iroh : versions épinglées, à relever à la main après lecture des notes de version
# et des avis de sécurité (cf. docs/phase2-internet.md, « Risques et parades »).
iroh = { version = "=1.3.0", default-features = false, features = ["portmapper", "tls-ring"] }
iroh-tickets = "=1.0.0"
iroh-mainline-address-lookup = "=0.6.0"
# Réseau public (phase 3.0, docs/phase3-reseau-public.md) : rendez-vous par des éléments
# signés de la DHT Mainline (BEP 44 ; n0-mainline est déjà celle de l'annuaire DHT), puis
# groupe de discussion d'Iroh. Accord de l'auteur le 18/10/2026.
n0-mainline = "=0.7.1"
iroh-gossip = { version = "=0.101.0", default-features = false, features = ["net"] }
sha2 = "0.11"

anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
# Relais lancé dans les essais « relais seulement » (tests/relay_only.rs), en HTTP comme
# `iroh-relay --dev` : la même version que celle d'Iroh, avec sa partie serveur.
iroh-relay = { version = "=1.3.0", features = ["server"] }
tempfile = "3"

[profile.release]
# Pas de panic = "abort" : sous Android, des bibliothèques réseau interceptent une
# panique quand l'environnement Java est absent (binaire nu sous Termux).
lto = "thin"
strip = true

# Programme livré avec les versions publiées (tools/publish.py) : bien plus petit, à
# transmettre de machine en machine, mais plusieurs minutes de construction de plus.
# Toujours sans panic = "abort" (cf. plus haut).
[profile.distribution]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
