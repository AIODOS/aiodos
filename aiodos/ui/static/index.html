<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIODOS</title>
  <link rel="icon" href="/logo.png?v=serpents">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/pygments.css">
</head>
<body>
  <div class="app">
    <!-- La barre de navigation, en bas : le logo, les vues, et les machines en ligne
         (js/views/connected.js) ; sur un écran étroit (téléphone), les vues moins courantes
         vont sous « Plus » (js/mobile.js) -->
    <nav class="rail" aria-label="Navigation principale">
      <img class="rail-logo" src="/logo.png?v=serpents" alt="AIODOS">
      <div class="rail-views">
      <button class="rail-btn" data-view="chat" title="Conversations"><span data-icon="chat"></span><span class="rail-label">Discussions</span></button>
      <button class="rail-btn" data-view="library" title="Bibliothèques"><span data-icon="library"></span><span class="rail-label">Bibliothèques</span></button>
      <button class="rail-btn" data-view="images" title="Images et vidéos"><span data-icon="image"></span><span class="rail-label">Images</span></button>
      <button class="rail-btn" data-view="jobs" title="Tâches">
        <span data-icon="jobs"></span><span class="rail-label">Tâches</span><span class="rail-badge" id="jobs-badge" hidden></span>
      </button>
      <button class="rail-btn" data-view="node" title="Cette machine"><span data-icon="node"></span><span class="rail-label">Cette machine</span></button>
      <button class="rail-btn" data-view="network" title="Réseau"><span data-icon="network"></span><span class="rail-label">Réseau</span><span class="rail-dot" id="net-dot" hidden></span></button>
      <button class="rail-btn" data-view="settings" title="Réglages"><span data-icon="settings"></span><span class="rail-label">Réglages</span></button>
      <button class="rail-btn rail-more" id="rail-more" title="Plus"><span data-icon="more"></span><span class="rail-label">Plus</span></button>
      </div>
      <button class="rail-status" id="rail-status" hidden></button>
    </nav>
    <main>
      <section class="view" id="view-chat" hidden></section>
      <section class="view" id="view-library" hidden></section>
      <section class="view" id="view-images" hidden></section>
      <section class="view" id="view-jobs" hidden></section>
      <section class="view" id="view-node" hidden></section>
      <section class="view" id="view-network" hidden></section>
      <section class="view" id="view-settings" hidden></section>
    </main>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
