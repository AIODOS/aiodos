<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIODOS</title>
  <link rel="icon" href="/logo.png?v=serpents">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/pygments.css">
</head>
<body>
  <div class="app">
    <!-- La barre de navigation, en bas : le logo, les vues, et les machines en ligne
         (js/views/connected.js). Les images sont un onglet des Bibliothèques, Cette machine
         une section des Réglages (27/10/2026). Les textes : data-t, posés par js/i18n.js -->
    <nav class="rail" data-t-label="nav.main">
      <img class="rail-logo" src="/logo.png?v=serpents" alt="AIODOS">
      <div class="rail-views">
      <button class="rail-btn" data-view="chat" data-t-title="nav.chat_title"><span data-icon="chat"></span><span class="rail-label" data-t="nav.chat"></span></button>
      <button class="rail-btn" data-view="library" data-t-title="nav.library"><span data-icon="library"></span><span class="rail-label" data-t="nav.library"></span></button>
      <button class="rail-btn" data-view="jobs" data-t-title="nav.jobs">
        <span data-icon="jobs"></span><span class="rail-label" data-t="nav.jobs"></span><span class="rail-badge" id="jobs-badge" hidden></span>
      </button>
      <button class="rail-btn" data-view="network" data-t-title="nav.network"><span data-icon="network"></span><span class="rail-label" data-t="nav.network"></span><span class="rail-dot" id="net-dot" hidden></span></button>
      <button class="rail-btn" data-view="settings" data-t-title="nav.settings"><span data-icon="settings"></span><span class="rail-label" data-t="nav.settings"></span></button>
      </div>
      <button class="rail-status" id="rail-status" hidden></button>
    </nav>
    <main>
      <section class="view" id="view-chat" hidden></section>
      <section class="view" id="view-library" hidden></section>
      <section class="view" id="view-jobs" hidden></section>
      <section class="view" id="view-network" hidden></section>
      <section class="view" id="view-settings" hidden></section>
    </main>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
